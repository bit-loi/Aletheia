services:
  searxng:
    image: searxng/searxng:latest
    container_name: aletheia-searxng
    restart: unless-stopped
    ports:
      # Bind to localhost only if you are fronting this with a tunnel or a
      # reverse proxy. Change to "8080:8080" to expose it on the host.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Must match the URL the Worker calls, including scheme.
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
