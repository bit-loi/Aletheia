<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aletheia</title>
  <!-- Blocking classic script: runs before the stylesheets below, so tokens are
       in the cascade before first paint and the popup never flashes unstyled. -->
  <script src="../shared/tokens.js" data-al-inject data-al-root=":root" data-al-light="body.light-theme"></script>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo-row">
        <div class="logo-info">
          <img src="../icons/Aletheia-Logo.png" alt="Aletheia" class="logo-icon">
          <div>
            <h1>Aletheia</h1>
            <p class="tagline" data-i18n="tagline">AI Fact-Checker</p>
          </div>
        </div>
        <div class="header-controls">
          <!-- Custom Language Dropdown -->
          <div class="lang-dropdown" id="lang-dropdown">
            <button class="lang-dropdown__trigger" id="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="lang-current">EN</span>
              <span class="lang-dropdown__arrow" aria-hidden="true"></span>
            </button>
            <div class="lang-dropdown__menu" id="lang-menu" role="listbox" aria-label="Select language">
              <!-- Items populated by JS -->
            </div>
          </div>
          <!-- Theme Toggle -->
          <div class="theme-toggle-container">
            <span class="theme-label" aria-hidden="true" data-i18n="dark">DARK</span>
            <span class="theme-switch">
              <input type="checkbox" id="theme-toggle" aria-label="Use light theme">
              <span class="slider"></span>
            </span>
            <span class="theme-label" aria-hidden="true" data-i18n="light">LIGHT</span>
          </div>
        </div>
      </div>
    </header>

    <main class="launch">
      <div class="connection-status" id="connection-status" role="status">
        <span class="connection-status__dot" aria-hidden="true"></span>
        <div>
          <div class="connection-status__title" id="connection-title" data-i18n="connecting_proxy">Menghubungkan ke proxy aman…</div>
          <div class="connection-status__detail" id="connection-detail" data-i18n="checking_services">Memeriksa layanan bersama.</div>
        </div>
      </div>

      <section class="mode-card" aria-labelledby="mode-title">
        <div class="mode-card__label" id="mode-card-label" data-i18n="current_page">Halaman saat ini</div>
        <h2 id="mode-title" data-i18n="detecting_page">Mendeteksi halaman…</h2>
        <p id="mode-description" data-i18n="detecting_best_mode">Aletheia sedang mendeteksi mode verifikasi terbaik.</p>
      </section>

      <button id="start-fact-check-btn" class="btn-primary" disabled data-i18n="detecting_tab">Mendeteksi tab…</button>
      <p id="action-status" class="action-status" role="status" aria-live="polite"></p>
    </main>

    <footer class="popup-footer">
      <p id="mode-hint" data-i18n="open_article_or_video">Buka artikel berita atau video YouTube, lalu mulai verifikasi.</p>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
