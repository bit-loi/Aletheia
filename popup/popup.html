<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aletheia Settings</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/form.css">
  <link rel="stylesheet" href="styles/dropdown.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo-row">
        <div class="logo-info">
          <img src="../icons/Aletheia-Logo.png" alt="Aletheia" class="logo-icon">
          <div>
            <h1>Aletheia</h1>
            <p class="tagline">AI Fact-Checker</p>
          </div>
        </div>
        <div class="theme-toggle-container" title="Toggle Light/Dark Theme">
          <span class="theme-label">DARK</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
          </label>
          <span class="theme-label">LIGHT</span>
        </div>
      </div>
    </header>

    <section class="settings-section">
      <h2>API Keys & Model</h2>

      <div class="field">
        <label for="nvidia-key">
          NVIDIA API Key
          <span class="optional-badge">MiniMax M3</span>
        </label>
        <input type="password" id="nvidia-key" placeholder="nvapi-…" autocomplete="off">
      </div>

      <div class="field">
        <label for="tavily-key">Tavily API Key</label>
        <input type="password" id="tavily-key" placeholder="tvly-…" autocomplete="off">
      </div>

      <div class="field">
        <label for="deepgram-key">
          Deepgram API Key
          <span class="optional-badge">YouTube mode</span>
        </label>
        <input type="password" id="deepgram-key" placeholder="dg-…" autocomplete="off">
      </div>

      <div class="field">
        <label>Active LLM Engine</label>
        <div class="engine-badge-card">
          <span class="engine-model-name">minimaxai/minimax-m3</span>
          <span class="engine-tag">NVIDIA NIM</span>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="start-youtube-btn" class="btn-secondary" style="display: none; margin-right: 8px;">Start Fact-Check</button>
      <button id="save-btn" class="btn-primary">Save Settings</button>
      <span id="save-status" class="save-status"></span>
    </div>

    <footer class="popup-footer">
      <p>Enter your own API keys. They are stored locally in your browser and never sent anywhere except the respective API endpoints.</p>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
