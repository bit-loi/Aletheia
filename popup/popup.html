<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aletheia</title>
  <!-- Blocking classic script: runs before the stylesheets below, so tokens are
       in the cascade before first paint and the popup never flashes unstyled. -->
  <script src="../shared/tokens.js" data-al-inject data-al-root=":root" data-al-light="body.light-theme"></script>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo-row">
        <div class="logo-info">
          <img src="../icons/Aletheia-Logo.png" alt="Aletheia" class="logo-icon">
          <div>
            <h1>Aletheia</h1>
            <p class="tagline">AI Fact-Checker</p>
          </div>
        </div>
        <div class="header-controls">
          <!-- Language Segmented Control -->
          <div class="lang-segmented-control" role="group" aria-label="Language">
            <button type="button" id="lang-btn-id" class="lang-segment active">ID</button>
            <button type="button" id="lang-btn-en" class="lang-segment">EN</button>
          </div>
          <!-- Theme Toggle -->
          <div class="theme-toggle-container">
            <span class="theme-label" aria-hidden="true">DARK</span>
            <span class="theme-switch">
              <input type="checkbox" id="theme-toggle" aria-label="Use light theme">
              <span class="slider"></span>
            </span>
            <span class="theme-label" aria-hidden="true">LIGHT</span>
          </div>
        </div>
      </div>
    </header>

    <main class="launch">
      <div class="connection-status" id="connection-status" role="status">
        <span class="connection-status__dot" aria-hidden="true"></span>
        <div>
          <div class="connection-status__title" id="connection-title">Menghubungkan ke proxy aman…</div>
          <div class="connection-status__detail" id="connection-detail">Memeriksa layanan bersama.</div>
        </div>
      </div>

      <section class="mode-card" aria-labelledby="mode-title">
        <div class="mode-card__label" id="mode-card-label">Halaman saat ini</div>
        <h2 id="mode-title">Mendeteksi halaman…</h2>
        <p id="mode-description">Aletheia sedang mendeteksi mode verifikasi terbaik.</p>
      </section>

      <button id="start-fact-check-btn" class="btn-primary" disabled>Mendeteksi tab…</button>
      <p id="action-status" class="action-status" role="status" aria-live="polite"></p>
    </main>

    <footer class="popup-footer">
      <p id="mode-hint">Buka artikel berita atau video YouTube, lalu mulai verifikasi.</p>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
